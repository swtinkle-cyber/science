<style>
:root { --primary:#2563eb; --bg:#f3f4f6; --card:#ffffff; --fg:#111827; --sub:#6b7280; --border:#d1d5db; --ok:#15803d; --okbg:#f0fdf4; --no:#b91c1c; --nobg:#fef2f2; }
* { box-sizing:border-box; }
body { margin:0; font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
#app { max-width:760px; margin:0 auto; padding:16px; }
h1 { font-size:22px; margin:8px 0 4px; }
h2 { font-size:16px; margin:0 0 8px; }
.sub { color:var(--sub); font-size:13px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-top:12px; }
.tree-mid { margin-top:8px; font-weight:600; }
.tree-small { margin-left:24px; font-weight:400; }
label.chk { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; }
.count { color:var(--sub); font-size:12px; margin-left:auto; }
.row { display:flex; flex-wrap:wrap; gap:8px 16px; }
button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--fg); padding:10px 16px; }
button.primary { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }
button:disabled { cursor:default; opacity:.6; }
button.link { border:none; background:none; color:var(--primary); padding:0; font-size:13px; }
.badge { display:inline-block; font-size:12px; border:1px solid var(--border); border-radius:4px; padding:1px 8px; margin-right:6px; }
.badge.type { border-color:var(--primary); color:var(--primary); }
.progress { height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; margin-top:8px; }
.progress > div { height:100%; background:var(--primary); }
.qtext { font-size:17px; font-weight:600; margin:12px 0; }
.opt { display:block; width:100%; text-align:left; margin-top:8px; }
.opt.sel { border-color:var(--primary); outline:2px solid var(--primary); }
.opt.right { border-color:var(--ok); background:var(--okbg); }
.opt.wrong { border-color:var(--no); background:var(--nobg); }
.oxwrap { display:flex; gap:12px; }
.oxwrap .opt { text-align:center; font-size:28px; font-weight:700; padding:20px 0; }
input[type=text], textarea { width:100%; font:inherit; padding:10px; border:1px solid var(--border); border-radius:8px; }
textarea { min-height:110px; resize:vertical; }
.fb { margin-top:12px; padding:12px; border-radius:8px; border:1px solid var(--border); }
.fb.ok { border-color:var(--ok); background:var(--okbg); }
.fb.no { border-color:var(--no); background:var(--nobg); }
.fb .verdict { font-weight:700; }
.fb.ok .verdict { color:var(--ok); }
.fb.no .verdict { color:var(--no); }
.actions { display:flex; justify-content:space-between; gap:8px; margin-top:16px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { border-bottom:1px solid var(--border); padding:6px 4px; text-align:left; }
td.num, th.num { text-align:right; }
.score { font-size:32px; font-weight:700; }
ul.crit { margin:6px 0; padding-left:0; list-style:none; }
.review { border-top:1px solid var(--border); padding:10px 0; font-size:14px; }
</style>

/* ============================ 앱 코드 ============================ */
const TYPE_LABEL = { ox: "OX퀴즈", mc: "5지선다형", short: "단답형", essay: "서술형" };
const TYPE_ORDER = ["ox", "mc", "short", "essay"];
const CIRCLED = ["①", "②", "③", "④", "⑤"];
const app = document.getElementById("app");

const PATH = {};
const SMALL_IDS = [];
UNITS.forEach(function (large) {
  large.children.forEach(function (mid) {
    mid.children.forEach(function (small) {
      PATH[small.id] = { large: large.title, mid: mid.title, small: small.title };
      SMALL_IDS.push(small.id);
    });
  });
});

const sel = { units: new Set(SMALL_IDS), types: new Set(TYPE_ORDER), count: "all", shuffle: true };
let session = null;

function el(tag, props) {
  const e = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function (k) {
      const v = props[k];
      if (k === "class") { e.className = v; }
      else if (k === "text") { e.textContent = v; }
      else if (k.indexOf("on") === 0) { e.addEventListener(k.slice(2), v); }
      else if (v === true) { e.setAttribute(k, ""); }
      else if (v !== false && v != null) { e.setAttribute(k, v); }
    });
  }
  for (let i = 2; i < arguments.length; i++) {
    const kid = arguments[i];
    if (kid == null) { continue; }
    if (Array.isArray(kid)) { kid.forEach(function (c) { if (c != null) { e.appendChild(c); } }); }
    else if (typeof kid === "string") { e.appendChild(document.createTextNode(kid)); }
    else { e.appendChild(kid); }
  }
  return e;
}

function countFor(unitIds) {
  return QUESTIONS.filter(function (q) { return unitIds.indexOf(q.unit) >= 0 && sel.types.has(q.type); }).length;
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function norm(s) {
  return String(s).toLowerCase().replace(/\s+/g, "").replace(/[.,。]$/g, "");
}

/* ---------------------------- 시작 화면 ---------------------------- */
function renderHome() {
  app.innerHTML = "";
  app.appendChild(el("h1", { text: "형성평가" }));
  app.appendChild(el("div", { class: "sub", text: "단원과 문항 유형을 고른 뒤 시작하세요." }));

  const unitCard = el("div", { class: "card" }, el("h2", { text: "단원 선택" }));
  UNITS.forEach(function (large) {
    const allIds = [];
    large.children.forEach(function (m) { m.children.forEach(function (s) { allIds.push(s.id); }); });
    const allOn = allIds.every(function (id) { return sel.units.has(id); });
    unitCard.appendChild(el("label", { class: "chk" },
      el("input", { type: "checkbox", checked: allOn, onchange: function (ev) {
        allIds.forEach(function (id) { if (ev.target.checked) { sel.units.add(id); } else { sel.units.delete(id); } });
        renderHome();
      } }),
      el("strong", { text: "대단원 " + large.title }),
      el("span", { class: "count", text: countFor(allIds) + "문항" })
    ));
    large.children.forEach(function (mid) {
      const ids = mid.children.map(function (s) { return s.id; });
      const midOn = ids.every(function (id) { return sel.units.has(id); });
      unitCard.appendChild(el("label", { class: "chk tree-mid" },
        el("input", { type: "checkbox", checked: midOn, onchange: function (ev) {
          ids.forEach(function (id) { if (ev.target.checked) { sel.units.add(id); } else { sel.units.delete(id); } });
          renderHome();
        } }),
        el("span", { text: mid.title }),
        el("span", { class: "count", text: countFor(ids) + "문항" })
      ));
      mid.children.forEach(function (small) {
        unitCard.appendChild(el("label", { class: "chk tree-small" },
          el("input", { type: "checkbox", checked: sel.units.has(small.id), onchange: function (ev) {
            if (ev.target.checked) { sel.units.add(small.id); } else { sel.units.delete(small.id); }
            renderHome();
          } }),
          el("span", { text: small.title }),
          el("span", { class: "count", text: countFor([small.id]) + "문항" })
        ));
      });
    });
  });
  app.appendChild(unitCard);

  const typeCard = el("div", { class: "card" }, el("h2", { text: "문항 유형" }));
  const typeRow = el("div", { class: "row" });
  TYPE_ORDER.forEach(function (t) {
    typeRow.appendChild(el("label", { class: "chk" },
      el("input", { type: "checkbox", checked: sel.types.has(t), onchange: function (ev) {
        if (ev.target.checked) { sel.types.add(t); } else { sel.types.delete(t); }
        renderHome();
      } }),
      el("span", { text: TYPE_LABEL[t] })
    ));
  });
  typeCard.appendChild(typeRow);
  app.appendChild(typeCard);

  const optCard = el("div", { class: "card" }, el("h2", { text: "출제 설정" }));
  const optRow = el("div", { class: "row" });
  [["all", "전체"], ["10", "10문항"], ["20", "20문항"]].forEach(function (pair) {
    optRow.appendChild(el("label", { class: "chk" },
      el("input", { type: "radio", name: "cnt", checked: sel.count === pair[0], onchange: function () { sel.count = pair[0]; } }),
      el("span", { text: pair[1] })
    ));
  });
  optRow.appendChild(el("label", { class: "chk" },
    el("input", { type: "checkbox", checked: sel.shuffle, onchange: function (ev) { sel.shuffle = ev.target.checked; } }),
    el("span", { text: "문항 순서 섞기" })
  ));
  optCard.appendChild(optRow);
  app.appendChild(optCard);

  const total = countFor(Array.from(sel.units));
  app.appendChild(el("div", { class: "actions" },
    el("span", { class: "sub", text: "선택한 조건의 문항: " + total + "개" }),
    el("button", { class: "primary", disabled: total === 0, onclick: function () {
      let list = QUESTIONS.filter(function (q) { return sel.units.has(q.unit) && sel.types.has(q.type); });
      if (sel.shuffle) { list = shuffled(list); }
      if (sel.count !== "all") { list = list.slice(0, Number(sel.count)); }
      startSession(list);
    }, text: "평가 시작" })
  ));
}

/* ---------------------------- 문항 화면 ---------------------------- */
function startSession(list) {
  session = { list: list, idx: 0, results: [] };
  renderQuestion();
}

function renderQuestion() {
  const q = session.list[session.idx];
  const p = PATH[q.unit];
  let response = null;
  let graded = false;
  app.innerHTML = "";

  app.appendChild(el("div", { class: "actions" },
    el("span", { class: "sub", text: (session.idx + 1) + " / " + session.list.length }),
    el("button", { class: "link", onclick: function () { if (confirm("평가를 그만두고 처음 화면으로 돌아갈까요?")) { renderHome(); } }, text: "그만두기" })
  ));
  app.appendChild(el("div", { class: "progress" }, el("div", { style: "width:" + (session.idx / session.list.length * 100) + "%" })));

  const card = el("div", { class: "card" });
  card.appendChild(el("div", null,
    el("span", { class: "badge type", text: TYPE_LABEL[q.type] }),
    el("span", { class: "sub", text: p.large + " > " + p.mid + " > " + p.small })
  ));
  card.appendChild(el("div", { class: "qtext", text: q.q }));

  const inputArea = el("div");
  const fbArea = el("div");
  const checkBtn = el("button", { class: "primary", disabled: true, text: "정답 확인" });
  const optBtns = [];
  let field = null;

  function setResponse(v) {
    response = v;
    checkBtn.disabled = (v === null || v === "");
  }

  if (q.type === "ox" || q.type === "mc") {
    const labels = q.type === "ox" ? ["O", "X"] : q.options.map(function (o, i) { return CIRCLED[i] + " " + o; });
    const values = q.type === "ox" ? ["O", "X"] : [0, 1, 2, 3, 4];
    const wrap = el("div", { class: q.type === "ox" ? "oxwrap" : "" });
    labels.forEach(function (lab, i) {
      const b = el("button", { class: "opt", text: lab, onclick: function () {
        if (graded) { return; }
        optBtns.forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        setResponse(values[i]);
      } });
      b.dataset.value = String(values[i]);
      optBtns.push(b);
      wrap.appendChild(b);
    });
    inputArea.appendChild(wrap);
  } else if (q.type === "short") {
    field = el("input", { type: "text", placeholder: "답을 입력하세요", oninput: function (ev) { setResponse(ev.target.value.trim()); } });
    field.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && !checkBtn.disabled && !graded) { grade(); } });
    inputArea.appendChild(field);
  } else {
    field = el("textarea", { placeholder: "답안을 서술하세요", oninput: function (ev) { setResponse(ev.target.value.trim()); } });
    inputArea.appendChild(field);
  }

  function grade() {
    graded = true;
    checkBtn.style.display = "none";
    if (field) { field.disabled = true; }
    const record = { q: q, response: response, correct: false };
    let answerText = "";

    if (q.type === "ox" || q.type === "mc") {
      record.correct = (response === q.answer);
      optBtns.forEach(function (b) {
        b.disabled = true;
        if (b.dataset.value === String(q.answer)) { b.classList.add("right"); }
        else if (b.dataset.value === String(response)) { b.classList.add("wrong"); }
      });
      answerText = q.type === "ox" ? q.answer : CIRCLED[q.answer] + " " + q.options[q.answer];
    } else if (q.type === "short") {
      const r = norm(response);
      record.correct = q.accept.some(function (a) { return norm(a) === r; });
      answerText = q.accept[0];
    } else {
      const r = norm(response);
      record.matched = q.keywords.map(function (group) {
        return group.some(function (k) { return r.indexOf(norm(k)) >= 0; });
      });
      record.correct = record.matched.every(function (m) { return m; });
    }
    session.results.push(record);

    const fb = el("div", { class: "fb " + (record.correct ? "ok" : "no") });
    const verdict = el("div", { class: "verdict", text: record.correct ? "정답입니다." : "오답입니다." });
    fb.appendChild(verdict);

    if (q.type === "essay") {
      verdict.textContent = record.correct ? "채점 기준을 모두 충족했습니다. (핵심어 기준 자동 판정)" : "채점 기준 중 빠진 내용이 있습니다. (핵심어 기준 자동 판정)";
      fb.appendChild(el("div", null, el("strong", { text: "모범 답안: " }), q.model));
      const ul = el("ul", { class: "crit" });
      q.criteria.forEach(function (c, i) {
        ul.appendChild(el("li", { text: (record.matched[i] ? "[충족] " : "[미충족] ") + c }));
      });
      fb.appendChild(ul);
      fb.appendChild(el("div", { class: "sub", text: "자동 판정은 핵심어 포함 여부만 확인합니다. 모범 답안과 비교하여 최종 결과를 직접 정할 수 있습니다." }));
      const selfRow = el("div", { class: "row", style: "margin-top:8px" });
      function setSelf(v) {
        record.correct = v;
        fb.className = "fb " + (v ? "ok" : "no");
        verdict.textContent = v ? "정답으로 처리했습니다." : "오답으로 처리했습니다.";
      }
      selfRow.appendChild(el("button", { onclick: function () { setSelf(true); }, text: "정답으로 처리" }));
      selfRow.appendChild(el("button", { onclick: function () { setSelf(false); }, text: "오답으로 처리" }));
      fb.appendChild(selfRow);
    } else {
      fb.appendChild(el("div", null, el("strong", { text: "정답: " }), answerText));
    }
    if (q.exp) { fb.appendChild(el("div", null, el("strong", { text: "해설: " }), q.exp)); }
    fbArea.appendChild(fb);

    const last = session.idx === session.list.length - 1;
    fbArea.appendChild(el("div", { class: "actions" }, el("span"),
      el("button", { class: "primary", onclick: function () {
        if (last) { renderResult(); } else { session.idx += 1; renderQuestion(); }
      }, text: last ? "결과 보기" : "다음 문항" })
    ));
  }

  checkBtn.addEventListener("click", grade);
  card.appendChild(inputArea);
  card.appendChild(fbArea);
  card.appendChild(el("div", { class: "actions" }, el("span"), checkBtn));
  app.appendChild(card);
  if (field) { field.focus(); }
}

/* ---------------------------- 결과 화면 ---------------------------- */
function tally(keyFn) {
  const map = {};
  session.results.forEach(function (r) {
    const k = keyFn(r.q);
    if (!map[k]) { map[k] = { total: 0, correct: 0 }; }
    map[k].total += 1;
    if (r.correct) { map[k].correct += 1; }
  });
  return map;
}

function statTable(title, keys, labelFn, map) {
  const tbl = el("table", null,
    el("tr", null, el("th", { text: title }), el("th", { class: "num", text: "정답 / 문항" }), el("th", { class: "num", text: "정답률" }))
  );
  keys.forEach(function (k) {
    if (!map[k]) { return; }
    tbl.appendChild(el("tr", null,
      el("td", { text: labelFn(k) }),
      el("td", { class: "num", text: map[k].correct + " / " + map[k].total }),
      el("td", { class: "num", text: Math.round(map[k].correct / map[k].total * 100) + "%" })
    ));
  });
  return tbl;
}

function renderResult() {
  const total = session.results.length;
  const correct = session.results.filter(function (r) { return r.correct; }).length;
  const wrong = session.results.filter(function (r) { return !r.correct; });
  app.innerHTML = "";
  app.appendChild(el("h1", { text: "평가 결과" }));
  app.appendChild(el("div", { class: "card" },
    el("div", { class: "score", text: correct + " / " + total }),
    el("div", { class: "sub", text: "정답률 " + Math.round(correct / total * 100) + "%" })
  ));
  app.appendChild(el("div", { class: "card" }, el("h2", { text: "소단원별 결과" }),
    statTable("소단원", SMALL_IDS, function (id) { return PATH[id].mid + " > " + PATH[id].small; }, tally(function (q) { return q.unit; }))
  ));
  app.appendChild(el("div", { class: "card" }, el("h2", { text: "유형별 결과" }),
    statTable("유형", TYPE_ORDER, function (t) { return TYPE_LABEL[t]; }, tally(function (q) { return q.type; }))
  ));

  if (wrong.length > 0) {
    const rv = el("div", { class: "card" }, el("h2", { text: "틀린 문항 다시 보기 (" + wrong.length + "개)" }));
    wrong.forEach(function (r) {
      const q = r.q;
      let ans = "";
      if (q.type === "ox") { ans = q.answer; }
      else if (q.type === "mc") { ans = CIRCLED[q.answer] + " " + q.options[q.answer]; }
      else if (q.type === "short") { ans = q.accept[0]; }
      else { ans = q.model; }
      let mine = r.response;
      if (q.type === "mc") { mine = CIRCLED[r.response] + " " + q.options[r.response]; }
      rv.appendChild(el("div", { class: "review" },
        el("div", null, el("span", { class: "badge type", text: TYPE_LABEL[q.type] }), el("span", { class: "sub", text: PATH[q.unit].small })),
        el("div", null, el("strong", { text: q.q })),
        el("div", { text: "내 답: " + mine }),
        el("div", { text: (q.type === "essay" ? "모범 답안: " : "정답: ") + ans }),
        q.exp ? el("div", { class: "sub", text: "해설: " + q.exp }) : null
      ));
    });
    app.appendChild(rv);
  }

  app.appendChild(el("div", { class: "actions" },
    el("button", { onclick: renderHome, text: "처음으로" }),
    wrong.length > 0 ? el("button", { class: "primary", onclick: function () {
      startSession(wrong.map(function (r) { return r.q; }));
    }, text: "틀린 문항 다시 풀기" }) : el("span")
  ));
}

renderHome();
</script>
</body>
